name: Automobile Ads CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # -----------------------------------
  # JOB 1: TEST
  # -----------------------------------
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Check Python version
        run: python --version

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          pytest -q backend/tests


  # -----------------------------------
  # JOB 2: LINT
  # -----------------------------------
  lint:
    name: Code Quality / Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Python linting
        run: |
          ruff check backend


  # -----------------------------------
  # JOB 3: DVC
  # -----------------------------------
  dvc:
    name: DVC Data Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install DVC
        run: pip install dvc

      - name: Check DVC installation
        run: dvc --version

      - name: Check DVC status
        run: dvc status


  # -----------------------------------
  # JOB 4: BUILD
  # -----------------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs:
      - test
      - lint
      - dvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------
      # Backend
      # -------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check backend syntax
        run: |
          python -m compileall backend

      # -------------------------------
      # Frontend
      # -------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # -------------------------------
      # Upload build artifact
      # -------------------------------
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: automobile-ads-frontend
          path: frontend/dist